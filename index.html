<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1430" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Business Quest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ffc46b'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1430; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(120% 80% at 50% 78%, #ffd7a8 0%, #f2a97c 28%, #9a6fa8 62%, #3a2a5e 100%);
        color: #fff7e8; font-family: 'Palatino Linotype', Palatino, Georgia, serif; text-align: center;
        transition: opacity .9s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .sun { width: 96px; height: 96px; border-radius: 50%; margin-bottom: 26px;
        background: radial-gradient(circle, #fffbe8 0%, #ffe3a3 45%, rgba(255,210,140,0) 72%); animation: bq-sun 3s ease-in-out infinite; }
      #loading h1 { margin: 0; font-weight: 400; font-size: clamp(34px, 9vw, 54px); letter-spacing: .06em; text-shadow: 0 2px 18px rgba(80,30,40,.45); }
      #loading p { margin: 10px 0 0; font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
      #loading .bar { margin-top: 34px; width: min(60vw, 240px); height: 4px; border-radius: 2px; background: rgba(255,247,232,.25); overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, #fff7e8, transparent);
        animation: bq-bar 1.4s ease-in-out infinite; }
      @keyframes bq-sun { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes bq-bar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" data-testid="loading"><div class="sun"></div><h1>Business Quest</h1><p>Sunmeadow awaits</p><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
